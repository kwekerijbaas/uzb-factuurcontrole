{% extends "basis.html" %}
{% block titel %}Week verwerken — UF{% endblock %}
{% block inhoud %}
<h1>Week verwerken</h1>
<div class="kaart">
  <form method="post" action="/week/verwerk" enctype="multipart/form-data">
    <label for="uzb">Uitzendbureau</label>
    <select id="uzb" name="uzb_sleutel" required>
      {% for sleutel, naam in uzbs.items() %}<option value="{{ sleutel }}">{{ naam }}</option>{% endfor %}
    </select>
    <div class="rij">
      <div>
        <label for="jaar">Jaar</label>
        <input id="jaar" type="number" name="iso_jaar" value="{{ iso_jaar }}" required>
      </div>
      <div>
        <label for="week">Weeknummer</label>
        <input id="week" type="number" name="iso_week" min="1" max="53" value="{{ iso_week }}" required>
      </div>
    </div>
    <label for="snoop">SNOOP-export (.xlsx)</label>
    <input id="snoop" type="file" name="snoop_bestand" accept=".xlsx" required>
    <p class="hint">Planning en loonschaal per medewerker.</p>
    <label for="nitea">Nitea-overzicht (.pdf)</label>
    <input id="nitea" type="file" name="nitea_bestand" accept=".pdf" required>
    <p class="hint">De werkelijk gewerkte uren; deze zijn leidend.</p>
    <button type="submit">Verwerken en overzicht downloaden</button>
  </form>
</div>
{% endblock %}
