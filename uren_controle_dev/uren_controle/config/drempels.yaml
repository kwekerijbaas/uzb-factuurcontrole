# Drempels en tolerantie voor de uren-controle
# Pas deze waarden aan zonder code te wijzigen.

# Tolerantie voor totaal-uren-vergelijking (Excel vs factuur).
# Verschillen kleiner dan dit worden niet als afwijking gemarkeerd.
# 0.05u = 3 minuten. Strakker = meer false positives door HH:MM ↔ decimaal afronding.
totaal_uren_drempel: 0.05

# Tolerantie voor tarief-match in tarieventabel (€/uur).
# Factuur toont 3 decimalen, tarieventabel 2 — kleine afronding mag.
tarief_drempel: 0.02

# Drempel voor splitsing-vergelijking (toeslagcategorieën 100/135/150).
# Splitsing wordt alleen GERAPPORTEERD, niet auto-flagged. Zie README.
splitsing_drempel: 0.25

# Drempel voor financiële impact bij "te veel gefactureerd".
# Bedragen onder dit niveau worden minder prominent getoond (niet hard rood).
financiele_drempel_eur: 5.00
